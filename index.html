<!DOCTYPE html>
<html lang="uz">
<head>

<!-- PWA (faqat brauzerda ishlaydi, WebView'da e'tiborga olinmaydi) -->

<link rel="apple-touch-icon" href="images/icon-192.png">

<!--

  Xatoni oldini olish uchun onerror bilan himoyalangan.
-->

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&family=JetBrains+Mono:wght@400;500&family=Noto+Serif:ital@1&display=swap"

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/dashboard.css">

<!-- IKKINCHI: Embedded JSON ma'lumotlar (WebView CORS muammosini hal qiladi) -->
<script src="js/data-embedded.js"></script>

<body>

<a href="#main-content" class="skip-link">Asosiy kontentga o'tish</a>

<!-- Splash Screen (kirish ekrani) -->
<div class="splash-screen" data-splash-screen>
  <img src="images/splash.jpg" alt="CzechMaster" class="splash-image" onerror="this.style.display='none'">
  <div class="splash-fallback">
    <div class="splash-logo">🇨🇿</div>
    <h1 class="splash-title">Czech<span>Master</span></h1>
    <p class="splash-sub">Chex tilini oson o'rganing</p>
  </div>
</div>
<script>
/* Splash himoyasi: app.js xato bersa ham splash 4s da majburan yo'qoladi */
(function(){
  setTimeout(function(){
    var s = document.querySelector('[data-splash-screen]');
    if (s && !s.classList.contains('hiding')) {
      s.classList.add('hiding');
      setTimeout(function(){ if (s.parentNode) s.remove(); }, 700);
    }
  }, 4000);
})();
</script>

<!-- Page Loader -->
<div class="page-loader" data-page-loader>
  <div class="spinner-lg"></div>
  <span class="text-secondary text-sm">CzechMaster yuklanmoqda...</span>
</div>

    <a href="#dashboard" class="header-logo">

      <span class="header-logo-text">Czech<span>Master</span></span>
    </a>

    <div class="header-search">

    <div class="header-actions">

        <svg class="icon-moon" viewBox="0 0 20 20" fill="currentColor" width="20" height="20" style="display:none"><path d="M17.3 13.6a8 8 0 01-10.9-10.9 1 1 0 00-1.2-1.4A10 10 0 1018.7 14.8a1 1 0 00-1.4-1.2z"/></svg>
      </button>
      <button class="icon-btn" aria-label="Bildirishnomalar">
        <svg viewBox="0 0 20 20" fill="currentColor"><path d="M10 2a6 6 0 00-6 6c0 3.6-1.5 5-1.5 5h15S16 11.6 16 8a6 6 0 00-6-6zM8.3 17a1.7 1.7 0 003.4 0H8.3z"/></svg>
      </button>
      <div class="user-avatar" data-user-menu-toggle>&#128100;</div>
    </div>
  </header>

  <div class="app-layout">
    <div class="sidebar-overlay" data-sidebar-overlay></div>

    <aside class="app-sidebar" id="sidebar">
      <nav class="sidebar-nav" data-sidebar-nav aria-label="Asosiy navigatsiya"></nav>

    <div class="main-wrapper">

    </div>

        <span class="mobile-nav-label">Kartalar</span>
      </li>
      <li class="mobile-nav-item" data-mobile-route="achievements">
        <svg viewBox="0 0 20 20" fill="currentColor"><path d="M10 1l2.4 5 5.6.5-4.2 3.7 1.3 5.5L10 18l-5.1 2.7 1.3-5.5L2 8.5 7.6 8 10 1z"/></svg>
        <span class="mobile-nav-label">Yutuqlar</span>
      </li>
      <li class="mobile-nav-item" data-mobile-route="settings">
        <svg viewBox="0 0 20 20" fill="currentColor"><path d="M10 10a3 3 0 100-6 3 3 0 000 6zm0 2c-3 0-6 1.5-6 4v1h12v-1c0-2.5-3-4-6-4z"/></svg>
